name: Deploy Frontend a AWS EC2

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest
            sudo docker stop front-despacho || true
            sudo docker rm front-despacho || true
            # IMPORTANTE: Usamos el puerto 80, que es el puerto web por defecto
            sudo docker run -d -p 80:80 --name front-despacho ${{ secrets.DOCKER_USERNAME }}/front-despacho:latest